<!DOCTYPE html>
<html lang="en">
  <head>
    <title> Don Plafon Videos! </title>
    <link rel="icon" href="https://fav.farm/💡" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background-color: #f7f7f7;
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }
 
      .container {
        width: 90%;
        margin: auto;
      }
 
      .square-div {
        width: 100%;
        padding-top: 100%;
        position: relative;
      }
 
      #videoPlayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
 
      main {
        max-width: 40em;
        padding: 0 15px 50px;
        margin: auto;
      }
 
      button {
        width: 47%;
        height: 2em;
        font-size: 1.2rem;
        display: block;
      }
 
      .btn-container {
        display: flex;
        margin: 30px 0;
        justify-content: space-between;
      }
 
      h1 {
        text-align: center;
      }
 
      #currentlyShowing {
        text-align: center;
      }
 
      pre {
        margin: 30px 0;
        font-size: 1rem;
      }

      video {
        background-color: #0001;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Don Plafon Videos! </h1>
      <div class="container">
        <div class="square-div">
          <video id="videoPlayer" muted playsinline autoplay loop type="video/mp4">
          </video>
        </div>
      </div>
      <pre id="currentlyShowing"> ... </pre>
      <div class="btn-container">
        <button id="prevButton" onClick="playPreviousVideo()" disabled>&lt; Previous</button>
        <button id="nextButton" onClick="playNextVideo()">Next &gt;</button>
      </div>
      <p> If videos aren't loading, try disabling AdBlock </p>
      <fieldset>
        <legend> hey programmers! </legend>
        <p> URLs and metadata for all the videos are available in <a href="./feed.json">JSON</a> and <a href="./feed.xml">XML</a> </p>
      </fieldset>
    </main>
 
    <script>
      const videoPlayer = document.getElementById('videoPlayer');
      const prevButton = document.getElementById('prevButton');
      const nextButton = document.getElementById('nextButton');
      const currentlyShowing = document.getElementById('currentlyShowing');
 
      let feed, videos;
      let currentVideoIndex = 0;
 
      async function main() {
        feed = await fetch('/feed.json').then(res => res.json());
        videos = feed.videos;
        shuffle(videos);
        loadVideo();
      }
 
      function loadVideo() {
        videoPlayer.src = videos[currentVideoIndex].url;
        videoPlayer.load();
        currentlyShowing.innerHTML = `video id: ${videos[currentVideoIndex].offerId}       ${currentVideoIndex + 1} / ${videos.length}`;
        updateButtonStates();
      }
 
      function playPreviousVideo() {
        currentVideoIndex = (currentVideoIndex - 1 + videos.length) % videos.length;
        loadVideo();
        // videoPlayer.play();
      }
 
      function playNextVideo() {
        currentVideoIndex = (currentVideoIndex + 1) % videos.length;
        loadVideo();
        // videoPlayer.play();
      }
 
      function updateButtonStates() {
        prevButton.disabled = currentVideoIndex === 0;
        nextButton.disabled = currentVideoIndex === videos.length - 1;
      }
 
      main().catch(error => {
        let msg = `Error fetching videos: ${error}`;
        console.error(msg);
        currentlyShowing.innerHTML = msg;
      });
 
      // VID DOESNT WORK ON IPHONE BECAUSE FUCKING SERVER
      function shuffle(array) {
        let currentIndex = array.length, randomIndex;
 
        while (currentIndex > 0) {
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
 
          [array[currentIndex], array[randomIndex]] = [
            array[randomIndex], array[currentIndex]];
        }
 
        return array;
      }
    </script>
  </body>
</html>
